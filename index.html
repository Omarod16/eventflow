:root{--green:#1F4A3A;--ivory:#F7F2EA;--paper:#FFFDF9;--field:#FFFFFF;--ink:#1F2B25;--muted:#5F675F;--line:#E7DFD1;--line-strong:#D6CBB8;--green-wash:#E3ECE5;--head:#F3EEE5;--hover:#F1EBE0;--copper:#C0703F;--brass:#A8683A;--danger:#B23E2D;--late:#2E557F;--shadow:0 1px 2px rgba(60,45,20,.05),0 18px 40px -24px rgba(60,45,20,.28)}
body.dark{--ivory:#121815;--paper:#1A221E;--field:#141B17;--ink:#ECE6DA;--muted:#A8B0A8;--line:#2B3631;--line-strong:#3B4842;--green-wash:#22342B;--head:#1F2924;--hover:#24302A;--copper:#E0915E;--brass:#D4A373;--danger:#F08A78;--late:#8FB4DA}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background-color:#F7F2EA;background-color:var(--ivory);background-image:var(--paper-img,none);background-position:center;background-size:cover;background-attachment:fixed;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.dark{background-image:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.serif{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600;letter-spacing:-.005em}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i-sm{width:16px;height:16px}.i-xs{width:14px;height:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;flex:0 0 244px;padding:22px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:rgba(255,253,249,.6)}
body.dark .side{background:rgba(26,34,30,.7)}
.main{flex:1;min-width:0;padding:34px 40px 110px}
.brand{display:flex;align-items:center;gap:12px;border:0;background:none;padding:4px 6px;cursor:pointer;text-align:left}
.mono{display:inline-block;color:var(--green);font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:40px;line-height:1;letter-spacing:-.1em;padding:0 .14em 3px 0;min-width:44px;text-align:center;background:linear-gradient(90deg,transparent 18%,#C9A06B 18%,#C9A06B 82%,transparent 82%) 0 100%/100% 1px no-repeat}
.mono-f{color:var(--brass);position:relative;top:.06em}
body.dark .mono{color:#9FCBB0}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-name{font-size:23px}
.brand-by{font-size:11.5px;color:var(--muted);margin-top:2px}
.side-new{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(60,45,20,.06)}
.side-new:hover{border-color:var(--green)}
.side-new .plus{width:32px;height:32px;border-radius:50%;background:var(--green-wash);display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--green-wash);font-weight:600}
.nav-spacer{flex:1}
.nav-tool{min-height:40px;font-size:13.5px;color:var(--muted)}
.nav-tool:hover{color:var(--ink)}
.nav-new{display:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;line-height:1;text-decoration:none}
.btn-lg{min-height:52px;padding:0 24px;font-size:15.5px;border-radius:12px}
.btn-sm{min-height:40px;padding:0 14px;font-size:13.5px}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{filter:brightness(.92)}
.btn-secondary{background:var(--paper);border-color:var(--line-strong)}
.btn-secondary:hover{border-color:var(--green)}
.btn-soft{background:var(--green-wash)}
.btn-quiet{background:transparent}
.btn-quiet:hover{background:var(--hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-outline{background:transparent;color:var(--danger);border-color:currentColor}
.btn-danger-soft{background:#FBEDEA;color:var(--danger)}
body.dark .btn-danger-soft{background:#3A2420}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.link-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 4px;border:0;background:transparent;color:var(--green);font-size:14px;font-weight:600;cursor:pointer}
body.dark .link-btn{color:#8FC2A4}
.link-ink{color:var(--ink) !important}

/* ---------- Tiles & tags ---------- */
.tile{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile .i{width:24px;height:24px;stroke-width:1.5}
.t-copper{background:#FBE9DC;color:#C0652F}.t-blue{background:#E2ECF7;color:#2F64A0}.t-teal{background:#DDEFEA;color:#26756A}.t-rose{background:#F8E4E8;color:#B04A63}.t-lav{background:#ECE7F7;color:#6A57A8}.t-plain{background:var(--hover);color:var(--muted)}
body.dark .t-copper{background:#3A2A1F}body.dark .t-blue{background:#1E2B3A}body.dark .t-teal{background:#1C3330}body.dark .t-rose{background:#3A2128}body.dark .t-lav{background:#2A2540}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.tag-late{background:#E3ECF7;color:#2E557F}
body.dark .tag-late{background:#1E2B3A;color:#8FB4DA}
.tag-overlap{background:#FBEBDD;color:#9A5A1E}
body.dark .tag-overlap{background:#3A2A1F;color:#E7B27C}

/* ---------- Forms ---------- */
.input,.select{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:10px;padding:0 14px;font-size:16px;background:var(--field)}
textarea.input{min-height:90px;padding:12px 14px;resize:vertical;line-height:1.45}
.select{appearance:none;-webkit-appearance:none;padding-right:38px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.select-sm{min-height:40px;font-size:14px;width:auto;min-width:160px}
.input:focus,.select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,74,58,.14)}
body.dark .input,body.dark .select{color-scheme:dark}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
.field-label{font-size:13.5px;font-weight:600}
.opt{font-weight:400;color:var(--muted)}
.req{color:var(--danger)}
.err{color:var(--danger);font-size:14px;font-weight:500;margin:8px 0 0}
.help{font-size:12.5px;color:var(--muted)}
.ifield{position:relative;min-width:0}
.ifield>.i{position:absolute;left:13px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.ifield>.input,.ifield>.select{padding-left:42px}
.switch{width:48px;height:28px;border-radius:999px;background:var(--line-strong);border:0;position:relative;cursor:pointer;padding:0;flex:none}
.switch::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--hover);padding:3px;border-radius:10px;gap:2px}

/* ---------- Page heads ---------- */

.hero-actions{display:flex;flex-wrap:wrap;gap:12px}

.sheet-card{position:relative;z-index:1;background:#FFFDF8;color:#1F2B25;border-radius:14px;padding:28px 24px 18px;box-shadow:0 2px 4px rgba(60,40,20,.06),0 40px 70px -30px rgba(60,40,20,.45);transform:rotate(-1.1deg);max-width:600px;justify-self:end;width:100%}

.tpl-sec{border-top:1px solid var(--line);padding-top:28px}

.tcard-body{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:0 14px;flex:1}

.tcard-title{margin:10px 0 2px;font-size:15px;font-weight:600;line-height:1.25}

/* Home: compact template grid */
.hero-tpls{margin-top:6px;max-width:680px}
.ht-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}

.ht:hover{border-color:var(--green);transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(60,45,20,.35)}
.ht img{width:56px;height:56px;border-radius:11px;object-fit:cover;flex:none}

.ht-text{display:flex;flex-direction:column;min-width:0;flex:1}

.ht>.i{position:absolute;right:8px;top:50%;margin-top:-7px;color:var(--green);opacity:0;transition:opacity .15s}

/* ---------- Library ---------- */

.paper.bw .pp-brand .mono{color:#111;background:linear-gradient(90deg,transparent 18%,#777 18%,#777 82%,transparent 82%) 0 100%/100% 1px no-repeat}
.paper.bw .mono-f{color:#555}
.paper.bw .pp-brand-text span,.paper.bw .pp-meta,.paper.bw .pp-foot{color:#444}
.paper.bw .pp-kicker input,.paper.bw .pp-kicker .i,.paper.bw .pp-crest span{color:#222}
.paper.bw .pp-crest img{filter:grayscale(1) contrast(1.1)}
.paper.bw .pp-head{border-bottom-color:#999}
.paper.bw .pp-table{border-color:#888}
.paper.bw .pp-table th{background:#fff;color:#111;border-bottom:1.5px solid #222}
.paper.bw .pp-table td{border-top-color:#CCC}
.paper.bw .pp-table .n{color:#333}
.paper.bw .pp-table .nd{color:#111;border:1px solid #777;border-radius:3px;padding:0 3px}
.paper.bw .pp-table td.day{background:#fff;color:#111;border-top:1.5px solid #555}
.paper.bw.elegant .pp-table th{border-bottom-color:#333}
/* ---------- Startup & recovery ---------- */
.boot{min-height:60vh;display:grid;place-items:center;padding:24px 8px}
.boot-card{max-width:440px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow)}
.boot-card .mono{font-size:44px}
.boot-title{font-size:30px;margin:10px 0 6px}
.boot-card p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.boot-help{opacity:0;animation:bootHelp .3s ease-out 3s forwards}
@keyframes bootHelp{to{opacity:1}}
.boot-help strong{color:var(--ink)}
.boot-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.boot-detail{margin-top:14px;text-align:left;font-size:12px;color:var(--muted)}
.boot-detail pre{white-space:pre-wrap;word-break:break-word;background:var(--hover);border-radius:8px;padding:8px;margin:6px 0 0;font-size:11px;max-height:140px;overflow:auto}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:4px;background:#1F2B25;color:#F7F2EA;padding:4px 4px 4px 18px;border-radius:12px;box-shadow:0 14px 34px -10px rgba(0,0,0,.4);font-size:14px;width:max-content;max-width:calc(100% - 28px)}
.toast-msg{padding:8px 0}
.toast-btn{min-height:40px;padding:0 12px;border:0;background:transparent;color:#BFE0CC;font-weight:700;cursor:pointer;border-radius:8px}
.toast-x{width:40px;height:40px;display:grid;place-items:center;border:0;background:transparent;color:#F7F2EA;opacity:.7;cursor:pointer;border-radius:8px}

/* ---------- Responsive ---------- */
@media (max-width:1240px){.tcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1180px) and (min-width:981px){.tt-cells{grid-template-columns:60px 60px minmax(120px,1.5fr) minmax(0,1fr) minmax(0,1fr) 80px}.tt-cells .c-notes{display:none}}
@media (max-width:1100px){
.hero{grid-template-columns:minmax(0,1fr);min-height:0}
.hero-bg{width:100%;height:55%;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),transparent);mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),transparent)}
.sheet-card{justify-self:center;transform:none}
}
@media (max-width:980px){
.tt-head{display:none}
.tt-row{grid-template-columns:24px minmax(0,1fr) 44px}
.tt-cells{grid-template-columns:62px minmax(0,1fr);gap:2px 12px;padding:12px 6px;align-items:start}
.c-time{grid-column:1;grid-row:1;font-size:16px}
.c-end{grid-column:1;grid-row:2;font-size:12px}
.c-act{grid-column:2;grid-row:1;white-space:normal !important;font-weight:600;flex-wrap:wrap}
.c-act .t{white-space:normal}
.c-meta{display:block;grid-column:2;grid-row:2;font-size:13px;color:var(--muted);white-space:normal !important}
.c-notes-m{display:block;grid-column:2;grid-row:3;font-size:13px;color:var(--muted);white-space:normal !important;font-style:italic}
.c-loc,.c-who,.c-dur,.c-notes{display:none}
.tt-dot::after{top:22px;margin-top:-5.5px}
.tt-row.first .tt-dot::before{top:22px}
.tt-row.last .tt-dot::before{bottom:auto;height:22px}
.tt-more{align-items:start;padding-top:6px}
}
@media (max-width:980px){
.print-layout{grid-template-columns:minmax(0,1fr)}
.print-panel{position:static;max-height:none}
}
@media (max-width:860px){
.ht-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.shell{display:block}
.side{position:sticky;top:0;z-index:40;height:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);background:rgba(255,253,249,.97);gap:8px}
body.dark .side{background:rgba(26,34,30,.97)}
.brand .mono{font-size:32px;min-width:36px}
.brand-name{font-size:20px}
.side-new{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;flex-direction:row;gap:0;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-item{flex:1;flex-direction:column;justify-content:center;gap:2px;min-height:54px;padding:0;font-size:11px;text-align:center;font-weight:500}
.nav-item.on{background:var(--green-wash)}
.nav-new{display:flex}
.nav-new .i{color:var(--green)}
body.dark .nav-new .i{color:#9FCBB0}
.nav-spacer{display:none}
.nav-tool{display:none}
.main{padding:20px 14px 110px}
.hero{margin:-20px -14px 0;padding:28px 14px 26px}
.toast{bottom:84px}
.panel{padding:20px 16px}
.form-grid{grid-template-columns:minmax(0,1fr)}
.ev-actions{width:100%}
.ev-actions .btn{flex:1 1 auto}
.feats{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
.tcards{grid-template-columns:repeat(2,minmax(0,1fr))}
.print-layout{grid-template-columns:minmax(0,1fr)}
.print-panel{position:static;max-height:none}
.pp-actions .btn-primary{display:none}
.print-bar{display:block;position:sticky;bottom:78px;z-index:30;margin-top:14px}
.print-bar .btn{width:100%;box-shadow:0 10px 24px -10px rgba(20,30,25,.5)}
}
@media (max-width:640px){
.hero-title,.hero-sub{text-align:center}
.hero-sub{font-size:clamp(18px,5vw,22px)}
.hero-welcome{font-size:clamp(30px,9.4vw,40px);display:inline-block;margin-bottom:4px}
.hero-brand{font-size:clamp(50px,16.4vw,68px);display:inline-block;line-height:.95}
.ht-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ht{min-height:62px;padding:8px 9px 8px 8px;gap:9px}
.ht img,.ht-blank{width:44px;height:44px;border-radius:9px}
.ht-text b{font-size:14px}
.ht-text small{font-size:12px}
.ht-title{font-size:25px}
.hero-bg{height:440px;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.4) 0%,rgba(0,0,0,.18) 55%,transparent 92%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.4) 0%,rgba(0,0,0,.18) 55%,transparent 92%)}
.trust{font-size:13.5px;margin:16px 0 22px}
.sc-foot>span{display:none}
.sc-foot{justify-content:flex-end}
.hero-tpls{margin-bottom:6px}
.drawer{top:auto;left:0;width:100%;max-height:92vh;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .2s ease-out}
@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.big-fields{grid-template-columns:120px minmax(0,1fr)}
.split{grid-template-columns:minmax(0,1fr)}
.sheet-card{padding:20px 14px 14px}
.crest{display:none}
.sc-title{padding-right:0;font-size:26px}
.sc-row{grid-template-columns:46px minmax(0,1.2fr) minmax(0,1fr);padding:8px}
.sc-row .w,.sc-row .r{display:none}
.tcards{grid-template-columns:minmax(0,1fr)}
.hero-actions .btn{width:100%}
.qa-label span{display:none}
.page-head .btn{width:100%}
.head-actions{width:100%}
.head-actions .btn{flex:1 1 0;width:auto;padding:0 12px}
}
@media (max-width:380px){
.ht img,.ht-blank{width:38px;height:38px}
.ht{gap:7px;padding:7px}
.ht-text b{font-size:13.5px}
.head-actions{gap:6px}
.head-actions .btn{padding:0 6px;font-size:13px;gap:5px}
.big-fields{grid-template-columns:minmax(0,1fr)}
.brand-by{display:none}
.feats{grid-template-columns:minmax(0,1fr)}
}
@media (hover:none){button.tt-cells:hover{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- Print ---------- */
@media print{
html,body{background:#fff !important}
.side,.nav,.print-panel,.print-bar,.preview-note,.toast,.layer,.no-print,.preview-only{display:none !important}
.shell,.print-layout{display:block}
.main{padding:0 !important}
.paper-fit{width:auto !important;height:auto !important;overflow:visible}
.paper-fit>.paper{position:static;transform:none !important;width:auto !important;min-height:0 !important;padding:0 !important;box-shadow:none;background:none !important;border-radius:0}
.pp-kicker input{border:0 !important;background:transparent !important}
.pp-kicker .i{display:none}
.pp-foot .brand-foot{display:none}
}

.lbl-short{display:none}
@media (max-width:860px){.lbl-long{display:none}.lbl-short{display:inline}}
